name: Publicar Release Windows Portable (FL-Lite Studio)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extraer version desde tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $clean = $tag.TrimStart('v', 'V')
          echo "version=$clean" >> $env:GITHUB_OUTPUT

      - name: Compilar ejecutable portable unico (sin instalar .NET)
        shell: pwsh
        run: |
          dotnet publish FLLiteStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:Version=${{ steps.ver.outputs.version }} -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0 -p:FileVersion=${{ steps.ver.outputs.version }}.0 -o publish_out

      - name: Crear GitHub Release con FLLiteStudio.exe portable
        uses: softprops/action-gh-release@v2
        with:
          files: publish_out/FLLiteStudio.exe
          generate_release_notes: true
